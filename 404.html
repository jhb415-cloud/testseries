<!-- v0.5.3 | 5-in-1 Dashboard SPA — 커스텀 404 페이지
     SEO 체크업 도구 지적사항 반영: Cloudflare Pages는 이 파일이 없으면 존재하지 않는 경로도
     index.html을 200으로 서빙하는데(사실상 SPA 폴백), 이 파일을 두면 진짜 404 상태코드로
     응답하면서 홈/주요 섹션으로 돌아갈 수 있는 안내 화면을 보여줄 수 있음. 해시 라우팅 SPA라
     실제로 존재하는 "다른 경로"는 없으므로(루트 "/"만 유효), 진짜 없는 경로에 대해서만 뜸. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>페이지를 찾을 수 없습니다 - 과몰입 연구소</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="assets/brand/favicon-32.png"/>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    text-align: center; padding: 2rem;
  }
  img { width: 64px; height: 64px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.75rem; font-weight: 900; margin: 0 0 .5rem; }
  p { color: #94a3b8; margin: 0 0 2rem; }
  .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; max-width: 480px; }
  a {
    color: #c4b5fd; text-decoration: none; font-weight: 700; font-size: .9rem;
    border: 1px solid #475569; border-radius: 999px; padding: .5rem 1rem;
  }
  a:hover { border-color: #8b5cf6; }
  a.home { background: #7c3aed; color: #fff; border-color: #7c3aed; }
</style>
</head>
<body>
  <img src="assets/brand/logo-icon-96.png" alt="과몰입 연구소"/>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>요청하신 주소가 존재하지 않거나 이동되었어요.</p>
  <div class="links">
    <a class="home" href="/">🏠 홈으로 가기</a>
    <a href="/#mbti">MBTI 테스트</a>
    <a href="/#brain">두뇌 나이 측정기</a>
    <a href="/#fortune">오늘의 운세</a>
    <a href="/#dream">꿈 해몽 검색</a>
    <a href="/#lotto">로또 번호 조합기</a>
  </div>
</body>
</html>
