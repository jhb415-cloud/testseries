<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Q1: 술이 들어가면 — 목소리 커지고 건배 제안(오렌지, 잔 부딪히며 소리burst) vs 조용히 사라짐(청록, 점선 발자국) -->
  <rect width="200" height="200" fill="#0b1226"/>
  <!-- 왼쪽: 건배하며 시끌벅적 -->
  <path d="M46 70l10 40h14l10-40z" fill="none" stroke="#ff9d6e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 66l8 44h12l8-44z" fill="none" stroke="#ff9d6e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M62 60l6-14M96 56l6-14M74 44l0-16" stroke="#ff9d6e" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 40l8 10M110 36l-8 10" stroke="#ff9d6e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- 오른쪽: 조용히 사라지는 사람 -->
  <circle cx="150" cy="70" r="12" fill="#5de7c2" opacity="0.9"/>
  <path d="M150 82c-10 0-16 8-16 18v10h32v-10c0-10-6-18-16-18z" fill="#5de7c2" opacity="0.9"/>
  <circle cx="140" cy="140" r="3" fill="#5de7c2" opacity="0.6"/>
  <circle cx="130" cy="156" r="2.4" fill="#5de7c2" opacity="0.4"/>
  <circle cx="122" cy="170" r="1.8" fill="#5de7c2" opacity="0.25"/>
</svg>
