<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Q9: 사람들 만나고 나면 — 오히려 에너지 참(왼쪽, 오렌지 반짝) vs 방전돼서 혼자 충전 필요(오른쪽, 청록 저전력 배터리) -->
  <rect width="200" height="200" fill="#f7f1e3"/>
  <g transform="rotate(-3 100 100)">
    <rect x="30" y="26" width="140" height="150" rx="4" fill="#fffdf7" stroke="#e4d9bf" stroke-width="2"/>
    <rect x="42" y="38" width="116" height="106" rx="2" fill="#efe6cf"/>
    <!-- 왼쪽: 에너지가 차오르는 사람 -->
    <circle cx="72" cy="98" r="17" fill="#d85a30"/>
    <circle cx="67" cy="94" r="2.6" fill="#3a2e1f"/>
    <circle cx="77" cy="94" r="2.6" fill="#3a2e1f"/>
    <path d="M64 106c4 5 14 5 18 0" fill="none" stroke="#3a2e1f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M52 66l8 12M92 66l-8 12M50 90l10 4M94 90l-10 4" stroke="#d85a30" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 오른쪽: 방전돼서 축 처진 사람 + 저전력 배터리 -->
    <circle cx="128" cy="96" r="13" fill="#1d9e75" opacity="0.85"/>
    <path d="M122 94a3 3 0 1 0 6 0" stroke="#fffdf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M120 118c8-6 22-2 22 8v6h-30v-2c0-6 3-10 8-12z" fill="#1d9e75" opacity="0.85"/>
    <rect x="112" y="66" width="24" height="13" rx="2" fill="none" stroke="#1d9e75" stroke-width="2.6"/>
    <rect x="136" y="70" width="3" height="5" fill="#1d9e75"/>
    <rect x="115" y="69" width="5" height="7" fill="#1d9e75"/>
  </g>
  <rect x="18" y="16" width="30" height="14" fill="#1d9e75" opacity="0.75" transform="rotate(-16 33 23)"/>
</svg>
