  <circle cx="144" cy="76" r="2.6" fill="#f5efe2"/>
  <circle cx="156" cy="76" r="2.6" fill="#f5efe2"/>
  <path d="M144 88c4-8 8-8 12 0" fill="none" stroke="#f5efe2" stroke-width="2.4" stroke-linecap="round"/>
</svg>
