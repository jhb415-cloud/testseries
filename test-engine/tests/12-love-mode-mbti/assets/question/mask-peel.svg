<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Q1: 좋아하는 사람이 생기면 — 적극적으로 다가감(오렌지, 하트 내밀며 전진) vs 티 안 내고 SNS만 몰래(청록, 폰+하트) -->
  <rect width="200" height="200" fill="#f5efe2"/>
  <!-- 왼쪽: 적극적으로 다가가는 사람 -->
  <circle cx="56" cy="92" r="20" fill="#d85a30"/>
  <circle cx="49" cy="87" r="3" fill="#f5efe2"/>
  <circle cx="63" cy="87" r="3" fill="#f5efe2"/>
  <path d="M46 100c6 6 18 6 24 0" fill="none" stroke="#f5efe2" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 92h30" stroke="#d85a30" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
  <path d="M118 92c-6-6-16-6-16 2 0 6 8 12 16 18 8-6 16-12 16-18 0-8-10-8-16-2z" fill="#d85a30"/>
  <!-- 오른쪽: 몰래 폰만 들여다보는 사람 -->
  <rect x="130" y="120" width="40" height="60" rx="6" fill="#33302a"/>
  <rect x="134" y="128" width="32" height="42" rx="2" fill="#1d9e75" opacity="0.85"/>
  <path d="M150 138c-6 5-8 10-8 15a8 8 0 0 0 16 0c0-5-2-10-8-15z" fill="#f5efe2"/>
