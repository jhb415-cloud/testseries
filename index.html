<!-- v0.0.3 | 5-in-1 Dashboard SPA -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>5-in-1 테스트 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css"/>
  <meta name="description" content="MBTI, 꿈 해몽, 오늘의 운세, 두뇌 나이 측정, ADHD 성향 진단 — 한 곳에서 모두!"/>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex">

<!-- ════════════════════════════════════════════════
     사이드바 내비게이션
════════════════════════════════════════════════ -->
<div id="sidebar-overlay"></div>

<aside id="sidebar"
  class="fixed top-0 left-0 h-full w-64 bg-slate-950 border-r border-slate-800 z-50 flex flex-col
         -translate-x-full lg:translate-x-0 transition-transform duration-300">

  <!-- 로고 -->
  <div class="px-5 py-6 border-b border-slate-800">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-2xl">🎯</span>
      <span class="text-white font-black text-lg tracking-tight">5-in-1 대시보드</span>
    </div>
    <p class="text-slate-500 text-xs">종합 테스트 & 검색 플랫폼</p>
  </div>

  <!-- 메뉴 -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
    <div class="nav-item" data-section="home">
      <span class="text-lg">🏠</span> 홈
    </div>
    <div class="nav-item" data-section="mbti">
      <span class="text-lg">🧠</span> 성격 파탄 (MBTI)
    </div>
    <div class="nav-item" data-section="dream">
      <span class="text-lg">🌙</span> 꿈 해몽 검색
    </div>
    <div class="nav-item" data-section="fortune">
      <span class="text-lg">🔮</span> 오늘의 운세
    </div>
    <div class="nav-item" data-section="brain">
      <span class="text-lg">⚡</span> 두뇌 나이 측정기
    </div>
    <div class="nav-item" data-section="adhd">
      <span class="text-lg">🌪️</span> 프로 미루러 (ADHD)
    </div>
  </nav>

  <!-- 버전 -->
  <div class="px-5 py-4 border-t border-slate-800">
    <p class="text-slate-600 text-xs">v0.0.1 · 2026-06-28</p>
  </div>
</aside>

<!-- ════════════════════════════════════════════════
     메인 콘텐츠 영역
════════════════════════════════════════════════ -->
<div class="flex-1 lg:ml-64 flex flex-col min-h-screen">

  <!-- 상단 헤더 (모바일) -->
  <header class="lg:hidden sticky top-0 z-30 bg-slate-950 border-b border-slate-800 px-4 py-3 flex items-center gap-3">
    <button id="hamburger-btn" class="text-slate-300 hover:text-white text-2xl leading-none">☰</button>
    <span class="text-white font-bold text-base">5-in-1 대시보드</span>
  </header>

  <!-- 콘텐츠 -->
  <main class="flex-1 p-4 sm:p-6 lg:p-8">

    <!-- ════ 🏠 홈 섹션 ════ -->
    <div id="section-home" class="section hidden">
      <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-black text-white">안녕하세요! 👋</h1>
            <p id="home-date" class="text-slate-400 text-sm mt-1"></p>
          </div>
        </div>

        <!-- 오늘의 폼 미친 한마디 -->
        <div class="bg-gradient-to-br from-violet-900/60 to-indigo-900/60 border border-violet-700/40 rounded-2xl p-6 mb-8 shadow-lg">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-xl">✨</span>
            <span class="text-violet-300 font-bold text-sm uppercase tracking-widest">오늘의 폼 미친 한마디</span>
          </div>
          <p id="home-quote-text" class="text-white text-xl sm:text-2xl font-semibold leading-relaxed mb-4"></p>
          <button id="home-copy-btn"
            class="bg-violet-700/50 hover:bg-violet-600/60 text-violet-200 text-sm font-semibold px-4 py-2 rounded-xl transition">
            📋 문구 복사
          </button>
        </div>

        <!-- 서비스 그리드 -->
        <h2 class="text-white font-bold text-lg mb-4">서비스 바로가기</h2>
        <div id="home-service-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      </div>
    </div>

    <!-- ════ 🧠 MBTI 섹션 ════ -->
    <div id="section-mbti" class="section hidden">
      <div class="max-w-2xl mx-auto">
        <div id="mbti-container"></div>
      </div>
    </div>

    <!-- ════ 🌙 꿈 해몽 섹션 ════ -->
    <div id="section-dream" class="section hidden">
      <div class="max-w-2xl mx-auto">
        <div id="dream-container"></div>
      </div>
    </div>

    <!-- ════ 🔮 오늘의 운세 섹션 ════ -->
    <div id="section-fortune" class="section hidden">
      <div class="max-w-2xl mx-auto">
        <div id="fortune-container"></div>
      </div>
    </div>

    <!-- ════ ⚡ 두뇌 나이 섹션 ════ -->
    <div id="section-brain" class="section hidden">
      <div class="max-w-2xl mx-auto">
        <div id="brain-container"></div>
      </div>
    </div>

    <!-- ════ 🌪️ 프로 미루러(ADHD) 섹션 ════ -->
    <div id="section-adhd" class="section hidden">
      <div class="max-w-2xl mx-auto">
        <div id="adhd-container"></div>
      </div>
    </div>

  </main><!-- /main -->

  <!-- 푸터 -->
  <footer class="border-t border-slate-800 px-6 py-4 text-slate-600 text-xs text-center">
    © 2026 5-in-1 Dashboard · 본 플랫폼의 모든 테스트 결과는 오락 목적이며 전문 진단을 대체하지 않습니다.
  </footer>
</div><!-- /main content -->

<!-- ════════════════════════════════════════════════
     3초 광고 프리로더 오버레이
════════════════════════════════════════════════ -->
<div id="preloader-overlay" class="hidden">
  <div class="text-center">
    <div class="loader-spinner mb-4 mx-auto"></div>
    <p class="text-slate-300 font-semibold text-lg mb-1">데이터를 심층 분석 중입니다...</p>
    <p class="text-slate-500 text-sm mb-6">잠시만 기다려주세요</p>

    <div class="flex items-center justify-center gap-2 text-slate-500">
      <span class="text-sm">자동으로 넘어갑니다</span>
      <span id="loader-count" class="text-violet-400 font-bold text-xl">3</span>
      <span class="text-sm">초</span>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════
     꿈 해몽 상세 팝업 모달
════════════════════════════════════════════════ -->
<div id="dream-modal" class="hidden">
  <div id="dream-modal-inner"></div>
</div>

<!-- ════════════════════════════════════════════════
     토스트 알림
════════════════════════════════════════════════ -->
<div id="toast"
  class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[99999]
         bg-slate-700 text-white text-sm font-semibold px-5 py-3 rounded-2xl shadow-xl
         transition-opacity duration-500 opacity-0 pointer-events-none">
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
